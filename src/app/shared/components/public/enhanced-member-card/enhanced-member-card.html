<article class="member-card" [class.is-interactive]="interactive()"
         [attr.role]="interactive() ? 'button' : null" [attr.tabindex]="interactive() ? 0 : null"
         [attr.aria-label]="interactive() ? 'Voir le profil de ' + name() : null"
         (click)="onActivate()" (keydown.enter)="onActivate()" (keydown.space)="$event.preventDefault(); onActivate()">
  <img [src]="avatar()" [alt]="name()" class="member-card__avatar" loading="lazy" />
  <div class="member-card__body">
    <div class="member-card__header">
      <h4>{{ name() }}</h4>
      @if (role() && hasLeadershipRole()) {
        <span class="member-card__role-seal">{{ role() }}</span>
      }
    </div>
    @if (grade()) {
      <span class="member-card__badge">{{ grade() }}</span>
    }
    @if (speciality()) {
      <p class="mt-3 max-w-[20ch] truncate">
        {{ speciality() }}
      </p>
    }
    @if (role() && !hasLeadershipRole()) {
      <p>Rôle : {{ role() }}</p>
    }
  </div>
</article>
